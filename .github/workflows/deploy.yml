name: Build & Deploy

# 자체 호스팅(Cloudflare Tunnel) 전환 작업이 끝날 때까지 자동 배포를 비활성화해둠.
# EC2로의 배포 대상이 바뀔 예정이라, 배포 준비가 되면 아래를 다시 push 트리거로 되돌릴 것.
# 그 전까지는 Actions 탭에서 수동(workflow_dispatch)으로만 실행 가능.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout source
        uses: actions/checkout@v5

      # 2. Java 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      # 3. Maven 빌드 (테스트 제외)
      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: my-server

      # 4. JAR 파일을 EC2 서버로 전송
      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: my-server/target/my-server-0.0.1-SNAPSHOT.jar
          target: ~/
          strip_components: 2

      # 5. EC2 서버에서 앱 재시작
      - name: Restart application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart my-server
            echo "✅ Deploy complete"
