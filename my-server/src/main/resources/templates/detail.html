<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>포스트 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .post-content {
            min-height: 300px; /* 내용 영역의 최소 높이 지정 */
            white-space: pre-wrap; /* textarea에서 입력된 줄바꿈(\n)을 <br> 태그처럼 표시 */
            word-break: break-word; /* 긴 단어 줄바꿈 */
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <!-- 포스트 헤더: 제목과 수정/삭제 버튼 -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 th:text="${post.title}">포스트 제목</h1>
                <!-- 1. 로그인한 사용자에게만 이 영역을 보여줌 (1차 방어) -->
                <div sec:authorize="isAuthenticated()">

                    <!-- 2. 로그인한 사용자가 작성자와 일치할 때만 버튼 표시 (2차 방어) -->
                    <!-- 주의: #authentication.name은 로그인 ID (username)입니다 -->
                    <div th:if="${post.user != null and post.user.username == #authentication.name}">
                        <a th:href="@{/post/edit/{id}(id=${post.id})}" class="btn btn-warning btn-sm">수정</a>
                        <a th:href="@{/post/delete/{id}(id=${post.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                    </div>
                </div>
            </div>

            <!-- 포스트 메타데이터: 작성자와 수정일 -->
            <div class="mb-4 text-muted">
                <span>작성자: </span>
                <span th:text="${post.username}" class="fw-bold">작성자명</span>
                <span class="ms-3">수정일: </span>
                <!-- 날짜를 보기 좋게 포맷 -->
                <span th:text="${#temporals.format(post.lastModifiedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2024-01-01 12:34</span>
            </div>

            <hr>

            <!-- 포스트 본문 내용 -->
            <div class="card">
                <!-- 'post' 객체의 content를 표시 -->
                <div class="card-body post-content" th:text="${post.content}">
                    포스트 내용
                </div>
            </div>

            <div class="card mt-4" th:if="${post.filePath != null and !post.filePath.isEmpty()}">
                <div class="card-header">
                    첨부파일
                </div>
                <div class="card-body">
                    <!-- 이미지 파일인 경우 미리보기 -->
                    <div th:if="${post.filePath.endsWith('.jpg') or post.filePath.endsWith('.png') or post.filePath.endsWith('.jpeg') or post.filePath.endsWith('.gif')}">
                        <img th:src="@{/uploads/{file}(file=${post.filePath})}"
                             style="max-width: 100%; height: auto; border-radius: 5px;"
                             alt="첨부 이미지">
                    </div>

                    <!-- 이미지가 아닌 파일인 경우 다운로드 링크 -->
                    <div th:unless="${post.filePath.endsWith('.jpg') or post.filePath.endsWith('.png') or post.filePath.endsWith('.jpeg') or post.filePath.endsWith('.gif')}">
                        <a th:href="@{/uploads/{file}(file=${post.filePath})}"
                           th:text="${post.filePath}"
                           class="btn btn-outline-primary" download>
                            파일 다운로드
                        </a>
                    </div>
                </div>
            </div>

            <!-- 목록으로 돌아가기 버튼 -->
            <div class="mt-4 text-center">
                <a href="/main/list" class="btn btn-secondary">목록으로 돌아가기</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
