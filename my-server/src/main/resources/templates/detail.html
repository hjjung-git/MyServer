<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>포스트 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dark-theme.css}" rel="stylesheet">
</head>
<body class="dark-theme">
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></div>

    <div class="app-main app-main-centered-lg">
        <!-- 포스트 헤더: 제목과 수정/삭제 버튼 -->
        <div class="app-topbar">
            <div>
                <span th:if="${post.type.name() == 'TRADE_LOG'}" class="badge-tradelog">매매일지</span>
                <span th:if="${post.type.name() == 'INSIGHT'}" class="badge-insight">인사이트</span>
                <h1 th:text="${post.title}" style="margin-top: 8px;">포스트 제목</h1>
            </div>

            <div sec:authorize="isAuthenticated()">
                <div th:if="${#authorization.expression('hasRole(''ADMIN'')') or (post.user != null and post.user.loginId == #authentication.name)}">
                    <a th:href="@{/post/edit/{id}(id=${post.id})}" class="btn btn-outline-light btn-sm">수정</a>
                    <a th:href="@{/post/delete/{id}(id=${post.id})}" class="btn btn-outline-danger btn-sm"
                       onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
                </div>
            </div>
        </div>

        <div class="mb-4" style="color: var(--text-secondary); font-size: 13px;">
            <span>작성자: </span>
            <span th:text="${post.user != null ? post.user.username : '알 수 없음'}" style="color: var(--text-primary); font-weight: 500;">작성자명</span>
            <span class="ms-3">수정일: </span>
            <span th:text="${#temporals.format(post.lastModifiedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2024-01-01 12:34</span>
        </div>

        <div th:if="${post.type.name() == 'TRADE_LOG'}" class="content-card mb-3">
            <div class="row g-2 text-center">
                <div class="col detail-stat">
                    <div class="label">종목</div>
                    <div class="value" th:text="${post.ticker}">BTC</div>
                </div>
                <div class="col detail-stat">
                    <div class="label">포지션</div>
                    <div class="value" th:text="${post.position}">LONG</div>
                </div>
                <div class="col detail-stat">
                    <div class="label">거래소</div>
                    <div class="value" th:text="${post.exchange}">Upbit</div>
                </div>
                <div class="col detail-stat">
                    <div class="label">진입가</div>
                    <div class="value" th:text="${post.entryPrice}">0</div>
                </div>
                <div class="col detail-stat">
                    <div class="label">청산가</div>
                    <div class="value" th:text="${post.exitPrice}">0</div>
                </div>
                <div class="col detail-stat">
                    <div class="label">수익률</div>
                    <div class="value"
                         th:text="(${post.profitRate != null and post.profitRate.signum() >= 0} ? '+' : '') + ${post.profitRate} + '%'"
                         th:style="${post.profitRate != null and post.profitRate.signum() >= 0} ? 'color: var(--accent-teal);' : 'color: var(--accent-red);'">0%</div>
                </div>
            </div>
        </div>

        <!-- 포스트 본문 내용 -->
        <div class="content-card">
            <div class="detail-content" th:text="${post.content}">
                포스트 내용
            </div>
        </div>

        <div class="content-card mt-3" th:if="${post.filePath != null and !post.filePath.isEmpty()}">
            <div class="section-label">첨부파일</div>
            <!-- 이미지 파일인 경우 미리보기 -->
            <div th:if="${post.filePath.endsWith('.jpg') or post.filePath.endsWith('.png') or post.filePath.endsWith('.jpeg') or post.filePath.endsWith('.gif')}">
                <img th:src="@{/uploads/{file}(file=${post.filePath})}"
                     style="max-width: 100%; height: auto; border-radius: 8px;"
                     alt="첨부 이미지">
            </div>

            <!-- 이미지가 아닌 파일인 경우 다운로드 링크 -->
            <div th:unless="${post.filePath.endsWith('.jpg') or post.filePath.endsWith('.png') or post.filePath.endsWith('.jpeg') or post.filePath.endsWith('.gif')}">
                <a th:href="@{/uploads/{file}(file=${post.filePath})}"
                   th:text="${post.filePath}"
                   class="btn btn-outline-light" download>
                    파일 다운로드
                </a>
            </div>
        </div>

        <!-- 목록으로 돌아가기 버튼 -->
        <div class="mt-4">
            <a href="/main/list" class="btn btn-outline-light">목록으로 돌아가기</a>
        </div>
    </div>
</div>
</body>
</html>
