<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포스트 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dark-theme.css}" rel="stylesheet">
</head>
<body class="dark-theme">
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></div>

    <div class="app-main" style="max-width: 720px;">
        <div class="app-topbar">
            <h1>포스트 수정</h1>
        </div>

        <div class="form-page-card">
            <form th:action="@{/post/update/{id}(id=${post.id})}" method="post" th:object="${post}" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label d-block">글 종류</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{type}" id="typeInsight" value="INSIGHT" onchange="toggleTradeFields()">
                        <label class="form-check-label" for="typeInsight">인사이트</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{type}" id="typeTradeLog" value="TRADE_LOG" onchange="toggleTradeFields()">
                        <label class="form-check-label" for="typeTradeLog">매매일지</label>
                    </div>
                </div>

                <div id="tradeFields" class="trade-fields-box mb-3" style="display: none;">
                    <div class="row g-2">
                        <div class="col-md-3">
                            <label for="ticker" class="form-label">종목</label>
                            <input type="text" th:field="*{ticker}" id="ticker" class="form-control dark-input" placeholder="BTC">
                        </div>
                        <div class="col-md-3">
                            <label for="position" class="form-label">포지션</label>
                            <select th:field="*{position}" id="position" class="form-select dark-input">
                                <option value="">선택</option>
                                <option value="LONG">LONG</option>
                                <option value="SHORT">SHORT</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="exchange" class="form-label">거래소</label>
                            <input type="text" th:field="*{exchange}" id="exchange" class="form-control dark-input" placeholder="Upbit">
                        </div>
                        <div class="col-md-3">
                            <label for="profitRate" class="form-label">수익률(%)</label>
                            <input type="number" step="0.01" th:field="*{profitRate}" id="profitRate" class="form-control dark-input" placeholder="5.2">
                        </div>
                        <div class="col-md-6">
                            <label for="entryPrice" class="form-label">진입가</label>
                            <input type="number" step="0.01" th:field="*{entryPrice}" id="entryPrice" class="form-control dark-input">
                        </div>
                        <div class="col-md-6">
                            <label for="exitPrice" class="form-label">청산가</label>
                            <input type="number" step="0.01" th:field="*{exitPrice}" id="exitPrice" class="form-control dark-input">
                        </div>
                    </div>
                </div>

                <!-- 제목 -->
                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" class="form-control dark-input" id="title" th:field="*{title}">
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger mt-1"></div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">작성자</label>
                    <input type="text" class="form-control dark-input" id="username" th:field="*{username}">
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger mt-1"></div>
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">내용</label>
                    <textarea class="form-control dark-input" id="content" rows="15" th:field="*{content}"></textarea>
                    <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-danger mt-1"></div>
                </div>

                <div class="mb-3">
                    <label for="file" class="form-label">첨부 파일</label>

                    <!-- 기존에 파일이 있다면 미리보기 or 파일명 표시 -->
                    <div th:if="${post.filePath != null and !post.filePath.isEmpty()}" class="mb-2">
                        <span style="color: var(--text-secondary);">현재 파일: </span>
                        <!-- 이미지인 경우 미리보기 -->
                        <img th:if="${post.filePath.endsWith('.jpg') or post.filePath.endsWith('.png') or post.filePath.endsWith('.jpeg')}"
                             th:src="@{/uploads/{file}(file=${post.filePath})}"
                             style="max-width: 200px; max-height: 100px; border: 0.5px solid var(--border-strong); border-radius: 6px;"
                             alt="현재 이미지">
                        <!-- 이미지가 아닌 경우 파일명 텍스트 -->
                        <span th:unless="${post.filePath.endsWith('.jpg') or post.filePath.endsWith('.png') or post.filePath.endsWith('.jpeg')}"
                              th:text="${post.filePath}" style="color: var(--text-primary);"></span>
                    </div>

                    <!-- 새 파일 선택 입력창 -->
                    <input type="file" class="form-control dark-input" id="file" name="file">
                    <div class="form-text" style="color: var(--text-tertiary);">새로운 파일을 선택하면 기존 파일이 교체됩니다.</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent">수정 완료</button>
                    <a th:href="@{/post/detail/{id}(id=${post.id})}" class="btn btn-outline-light">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script th:inline="none">
    function toggleTradeFields() {
        var isTradeLog = document.getElementById('typeTradeLog').checked;
        document.getElementById('tradeFields').style.display = isTradeLog ? 'block' : 'none';
    }
    document.addEventListener('DOMContentLoaded', toggleTradeFields);
</script>
</body>
</html>
