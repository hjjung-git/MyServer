<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>페이지를 찾을 수 없습니다</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="text-center">
        <h1 class="display-1 fw-bold text-danger">404</h1>
        <p class="fs-3 mt-3"> <span class="text-dark">앗!</span> 페이지를 찾을 수 없습니다.</p>
        <!-- Controller에서 넘긴 에러 메시지를 출력합니다 -->
        <p class="lead text-muted" th:text="${errorMessage}">요청하신 게시글이 존재하지 않습니다.</p>
        <a href="/main/list" class="btn btn-primary mt-4">홈으로 돌아가기</a>
    </div>
</body>
</html>
