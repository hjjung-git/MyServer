<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>서버 오류</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/dark-theme.css}" rel="stylesheet">
</head>
<body class="dark-theme">
<div class="error-shell">
    <div>
        <p class="error-code warning">500</p>
        <p class="error-title">서버 내부 오류가 발생했습니다</p>
        <p class="error-message" th:text="${errorMessage}">잠시 후 다시 시도해 주세요.</p>
        <a href="/main/list" class="btn btn-accent">홈으로 돌아가기</a>
    </div>
</div>
</body>
</html>
