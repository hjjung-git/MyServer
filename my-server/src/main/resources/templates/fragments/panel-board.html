<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="board">
    <!-- 검색 -->
    <div class="d-flex gap-2 mb-3">
        <input type="text" id="panel-keyword" class="form-control form-control-sm dark-input"
               placeholder="검색어" th:value="${keyword}" style="flex:1;">
        <button class="btn btn-sm btn-accent" onclick="panelSearch()">검색</button>
    </div>

    <!-- 새 글 작성 버튼 -->
    <a href="/post/write/form" class="btn btn-accent btn-sm mb-3 d-block text-center">
        <i class="bi bi-plus-lg"></i> 새 글 작성
    </a>

    <!-- 게시글 목록 -->
    <div th:if="${posts.isEmpty()}" style="color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 32px 0;">
        게시글이 없습니다.
    </div>

    <div th:each="post : ${posts}"
         class="panel-post-card"
         data-panel-post th:attr="data-panel-post=${post.id}">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 6px;">
                <span th:if="${post.type.name() == 'TRADE_LOG'}" class="badge-tradelog">매매일지</span>
                <span th:if="${post.type.name() == 'INSIGHT'}" class="badge-insight">인사이트</span>
                <span th:if="${post.type.name() == 'TRADE_LOG' and post.ticker != null}"
                      style="font-size: 11px; color: var(--text-secondary);"
                      th:text="${post.ticker} + (${post.position != null} ? ' · ' + ${post.position} : '')"></span>
            </div>
            <span th:if="${post.type.name() == 'TRADE_LOG' and post.profitRate != null}"
                  th:text="(${post.profitRate.signum() >= 0} ? '+' : '') + ${post.profitRate} + '%'"
                  th:style="${post.profitRate.signum() >= 0} ? 'color:var(--accent-teal);font-family:monospace;font-size:12px;' : 'color:var(--accent-red);font-family:monospace;font-size:12px;'"></span>
        </div>
        <div class="post-title" th:text="${post.title}">제목</div>
        <div class="post-meta">
            <span th:text="${post.user != null ? post.user.username : '알 수 없음'}"></span>
            <span> · </span>
            <span th:text="${#temporals.format(post.lastModifiedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}"></span>
        </div>
    </div>

    <!-- 페이지네이션 -->
    <div th:if="${posts.totalPages > 1}" class="d-flex justify-content-center gap-1 mt-3 flex-wrap">
        <button th:if="${posts.hasPrevious()}"
                class="btn btn-sm btn-outline-secondary"
                data-panel-page th:attr="data-panel-page=${type + ':' + (posts.number - 1) + ':' + (keyword ?: '')}">
            &lt;
        </button>

        <th:block th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}">
            <button class="btn btn-sm"
                    th:classappend="${i == posts.number} ? 'btn-accent' : 'btn-outline-secondary'"
                    data-panel-page th:attr="data-panel-page=${type + ':' + i + ':' + (keyword ?: '')}"
                    th:text="${i + 1}">1</button>
        </th:block>

        <button th:if="${posts.hasNext()}"
                class="btn btn-sm btn-outline-secondary"
                data-panel-page th:attr="data-panel-page=${type + ':' + (posts.number + 1) + ':' + (keyword ?: '')}">
            &gt;
        </button>
    </div>

    <script th:inline="none">
        function panelSearch() {
            var kw = document.getElementById('panel-keyword').value;
            loadBoard(currentPanelType, 0, kw);
        }
    </script>
</div>
</body>
</html>
