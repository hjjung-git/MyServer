<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="detail">
    <!-- 뒤로가기 -->
    <button class="btn btn-sm btn-outline-secondary mb-3"
            data-panel-back th:attr="data-panel-back=${post.type.name()}">
        <i class="bi bi-arrow-left"></i> 목록으로
    </button>

    <!-- 매매 통계 (TRADE_LOG만) -->
    <div th:if="${post.type.name() == 'TRADE_LOG'}" class="detail-card mb-3">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center;">
            <div class="detail-stat">
                <div class="label">종목</div>
                <div class="value" th:text="${post.ticker ?: '-'}"></div>
            </div>
            <div class="detail-stat">
                <div class="label">포지션</div>
                <div class="value" th:text="${post.position ?: '-'}"></div>
            </div>
            <div class="detail-stat">
                <div class="label">거래소</div>
                <div class="value" th:text="${post.exchange ?: '-'}"></div>
            </div>
            <div class="detail-stat">
                <div class="label">진입가</div>
                <div class="value" th:text="${post.entryPrice ?: '-'}"></div>
            </div>
            <div class="detail-stat">
                <div class="label">청산가</div>
                <div class="value" th:text="${post.exitPrice ?: '-'}"></div>
            </div>
            <div class="detail-stat">
                <div class="label">수익률</div>
                <div class="value"
                     th:if="${post.profitRate != null}"
                     th:text="(${post.profitRate.signum() >= 0} ? '+' : '') + ${post.profitRate} + '%'"
                     th:style="${post.profitRate.signum() >= 0} ? 'color:var(--accent-teal)' : 'color:var(--accent-red)'"></div>
                <div class="value" th:unless="${post.profitRate != null}">-</div>
            </div>
        </div>
    </div>

    <!-- 제목 / 메타 -->
    <div class="detail-card mb-3">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
            <span th:if="${post.type.name() == 'TRADE_LOG'}" class="badge-tradelog">매매일지</span>
            <span th:if="${post.type.name() == 'INSIGHT'}" class="badge-insight">인사이트</span>
        </div>
        <h5 style="color: var(--text-primary); font-size: 15px; font-weight: 500; margin-bottom: 6px;"
            th:text="${post.title}"></h5>
        <div style="font-size: 11px; color: var(--text-tertiary);">
            <span th:text="${post.user != null ? post.user.username : '알 수 없음'}"></span>
            <span> · </span>
            <span th:text="${#temporals.format(post.lastModifiedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}"></span>
        </div>
    </div>

    <!-- 본문 -->
    <div class="detail-card mb-3">
        <div class="detail-content" th:text="${post.content}"></div>
    </div>

    <!-- 첨부 파일 -->
    <div th:if="${post.filePath != null and !post.filePath.isEmpty()}" class="detail-card mb-3">
        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">첨부 파일</div>
        <img th:if="${post.filePath.endsWith('.jpg') or post.filePath.endsWith('.png') or post.filePath.endsWith('.jpeg')}"
             th:src="@{/uploads/{file}(file=${post.filePath})}"
             style="max-width: 100%; border-radius: 6px;" alt="첨부 이미지">
        <span th:unless="${post.filePath.endsWith('.jpg') or post.filePath.endsWith('.png') or post.filePath.endsWith('.jpeg')}"
              th:text="${post.filePath}" style="color: var(--text-primary); font-size: 13px;"></span>
    </div>

    <!-- 수정/삭제 버튼 (로그인한 본인만) -->
    <div sec:authorize="isAuthenticated()" class="d-flex gap-2">
        <a th:href="@{/post/edit/{id}(id=${post.id})}" class="btn btn-sm btn-outline-light">수정</a>
        <a th:href="@{/post/delete/{id}(id=${post.id})}" class="btn btn-sm btn-outline-danger"
           onclick="return confirm('삭제하시겠습니까?')">삭제</a>
    </div>
</div>
</body>
</html>
