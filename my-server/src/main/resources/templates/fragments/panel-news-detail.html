<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="detail" style="display:flex; flex-direction:column; gap:0;">

    <div th:if="${article == null}" style="text-align:center; padding:48px 0; color:var(--text-tertiary); font-size:13px;">
        기사를 찾을 수 없습니다.
    </div>

    <div th:if="${article != null}">

        <!-- 뒤로가기 -->
        <button class="btn btn-sm btn-outline-secondary" data-panel-back-news
                style="align-self:flex-start; margin-bottom:18px; font-size:12px;">
            <i class="bi bi-chevron-left"></i> 목록
        </button>

        <!-- 출처 + 날짜 -->
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
            <span class="news-source-badge" th:text="${article.source}">CoinTelegraph</span>
            <span style="font-size:11px; color:var(--text-tertiary);"
                  th:text="${#temporals.format(article.publishedAt, 'yyyy.MM.dd HH:mm', 'Asia/Seoul')}">2026.06.17 12:00</span>
        </div>

        <!-- 제목 -->
        <div style="font-size:16px; font-weight:700; color:var(--text-primary); line-height:1.55;
                    margin-bottom:20px; word-break:keep-all;"
             th:text="${article.title}">제목</div>

        <!-- AI 한국어 요약 (두괄식) — API 키 설정 시 표시 -->
        <div th:if="${article.koreanSummary != null and !article.koreanSummary.isEmpty()}"
             style="border-left:3px solid var(--accent-teal); background:rgba(91,217,155,0.07);
                    padding:14px 16px; border-radius:0 8px 8px 0; margin-bottom:20px;">
            <div style="font-size:10px; font-weight:700; color:var(--accent-teal);
                        letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px;">
                🤖 AI 한국어 요약
            </div>
            <div style="font-size:13.5px; color:var(--text-primary); line-height:1.8;
                        white-space:pre-line; word-break:keep-all;"
                 th:text="${article.koreanSummary}"></div>
        </div>

        <!-- AI 요약 없을 때 안내 -->
        <div th:if="${article.koreanSummary == null or article.koreanSummary.isEmpty()}"
             style="border-left:3px solid var(--border-color); background:var(--bg-secondary);
                    padding:12px 14px; border-radius:0 8px 8px 0; margin-bottom:20px;
                    font-size:12px; color:var(--text-tertiary);">
            아직 번역 대기 중입니다. 잠시 후 다시 확인해주세요.
        </div>

        <!-- 구분선 -->
        <div style="border-top:1px solid var(--border-color); margin-bottom:16px;"></div>

        <!-- 원문 영어 요약 -->
        <div style="font-size:12px; font-weight:600; color:var(--text-tertiary);
                    letter-spacing:0.05em; margin-bottom:8px;">원문 요약</div>
        <div th:if="${article.summary != null}"
             style="font-size:13px; color:var(--text-secondary); line-height:1.7;
                    margin-bottom:24px; word-break:break-word;"
             th:text="${article.summary}">-</div>
        <div th:if="${article.summary == null}"
             style="font-size:13px; color:var(--text-tertiary); margin-bottom:24px;">요약 없음</div>

        <!-- 원문 보기 버튼 -->
        <a th:href="${article.url}" target="_blank" rel="noopener"
           class="btn btn-sm btn-outline-secondary" style="font-size:12px; align-self:flex-start;">
            <i class="bi bi-box-arrow-up-right"></i> 원문 보기
        </a>

    </div>
</div>
</body>
</html>
