<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="news">

    <div th:if="${articles.isEmpty()}" style="text-align:center; padding:48px 0; color:var(--text-tertiary); font-size:13px;">
        <i class="bi bi-newspaper" style="font-size:28px; display:block; margin-bottom:10px;"></i>
        뉴스를 수집 중입니다.<br>잠시 후 다시 확인해주세요.
    </div>

    <div th:each="article : ${articles}" class="news-card">
        <div class="news-source-row">
            <span class="news-source-badge" th:text="${article.source}">CoinTelegraph</span>
            <span class="news-time"
                  th:text="${#temporals.format(article.publishedAt, 'MM/dd HH:mm', 'Asia/Seoul')}">06/17 12:00</span>
        </div>
        <a th:href="${article.url}" target="_blank" rel="noopener" class="news-title"
           th:text="${article.title}">제목</a>
        <p th:if="${article.summary != null}" class="news-summary" th:text="${article.summary}"></p>
    </div>

    <!-- 페이지네이션 -->
    <div th:if="${articles.totalPages > 1}" class="d-flex justify-content-center gap-1 mt-3 flex-wrap">
        <button th:if="${articles.hasPrevious()}"
                class="btn btn-sm btn-outline-secondary"
                data-panel-news th:attr="data-panel-news=${articles.number - 1}">&lt;</button>

        <th:block th:each="i : ${#numbers.sequence(0, articles.totalPages - 1)}">
            <button class="btn btn-sm"
                    th:classappend="${i == articles.number} ? 'btn-accent' : 'btn-outline-secondary'"
                    data-panel-news th:attr="data-panel-news=${i}"
                    th:text="${i + 1}">1</button>
        </th:block>

        <button th:if="${articles.hasNext()}"
                class="btn btn-sm btn-outline-secondary"
                data-panel-news th:attr="data-panel-news=${articles.number + 1}">&gt;</button>
    </div>
</div>
</body>
</html>
