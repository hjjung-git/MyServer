<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>JHJ's Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dark-theme.css}" rel="stylesheet">
</head>
<body class="dark-theme">
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></div>

    <div class="app-main">
        <div class="app-topbar">
            <h1 th:text="${type == null ? '대시보드' : (type.name() == 'TRADE_LOG' ? '매매일지' : '인사이트')}">대시보드</h1>

            <div sec:authorize="isAnonymous()">
                <a href="/user/login" class="btn btn-outline-light btn-sm me-2">로그인</a>
                <a href="/user/join" class="btn btn-accent btn-sm">회원가입</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                <span class="me-3" style="font-size: 13px; color: var(--text-secondary);">
                    <b sec:authentication="name" style="color: var(--text-primary);"></b>님
                </span>
                <form th:action="@{/user/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-outline-light btn-sm">로그아웃</button>
                </form>
            </div>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card accent-positive">
                <div class="label">총 게시글</div>
                <div class="value" th:text="${posts.totalElements}">0</div>
            </div>
            <div class="kpi-card">
                <div class="label">현재 페이지</div>
                <div class="value" th:text="${posts.number + 1} + ' / ' + ${posts.totalPages}">1 / 1</div>
            </div>
            <div class="kpi-card">
                <div class="label">검색 결과</div>
                <div class="value" th:text="${posts.numberOfElements}">0</div>
            </div>
        </div>

        <div th:if="${type == null}" style="display: grid; grid-template-columns: 1.7fr 1fr; gap: 14px; margin-bottom: 24px;">
            <div class="chart-panel">
                <div class="chart-header">
                    <span class="symbol">BTC / KRW</span>
                    <span class="change positive">데이터 연동 예정</span>
                </div>
                <svg viewBox="0 0 400 140" preserveAspectRatio="none" style="width: 100%; height: 140px; display: block;">
                    <polyline points="0,105 30,112 60,96 90,103 120,83 150,87 180,70 210,77 240,54 270,61 300,39 330,45 360,22 400,9"
                              fill="none" stroke="#5BD99B" stroke-width="2"/>
                    <polygon points="0,105 30,112 60,96 90,103 120,83 150,87 180,70 210,77 240,54 270,61 300,39 330,45 360,22 400,9 400,140 0,140"
                             fill="#5BD99B" opacity="0.08"/>
                </svg>
                <div class="chart-axis-labels">
                    <span>D-6</span><span>D-4</span><span>D-2</span><span>오늘</span>
                </div>
            </div>

            <div class="content-card">
                <div class="section-label">워치리스트</div>
                <div class="watchlist-row">
                    <span class="symbol">BTC</span>
                    <svg viewBox="0 0 60 20" style="width: 60px; height: 20px;"><polyline points="0,14 15,16 30,9 45,11 60,3" fill="none" stroke="#5BD99B" stroke-width="1.5"/></svg>
                    <span class="change positive">-</span>
                </div>
                <div class="watchlist-row">
                    <span class="symbol">ETH</span>
                    <svg viewBox="0 0 60 20" style="width: 60px; height: 20px;"><polyline points="0,4 15,7 30,6 45,12 60,17" fill="none" stroke="#E3766F" stroke-width="1.5"/></svg>
                    <span class="change negative">-</span>
                </div>
                <div class="watchlist-row">
                    <span class="symbol">SOL</span>
                    <svg viewBox="0 0 60 20" style="width: 60px; height: 20px;"><polyline points="0,16 15,12 30,13 45,6 60,2" fill="none" stroke="#5BD99B" stroke-width="1.5"/></svg>
                    <span class="change positive">-</span>
                </div>
            </div>
        </div>

        <div th:if="${type == null}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px;">
            <div class="mini-chart-card">
                <div class="mini-chart-header">
                    <span class="symbol">XRP</span>
                    <span class="change positive">-</span>
                </div>
                <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width: 100%; height: 40px;"><polyline points="0,28 25,30 50,24 75,18 100,14" fill="none" stroke="#5BD99B" stroke-width="1.5"/></svg>
            </div>
            <div class="mini-chart-card">
                <div class="mini-chart-header">
                    <span class="symbol">ADA</span>
                    <span class="change negative">-</span>
                </div>
                <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width: 100%; height: 40px;"><polyline points="0,14 25,18 50,22 75,28 100,34" fill="none" stroke="#E3766F" stroke-width="1.5"/></svg>
            </div>
            <div class="mini-chart-card">
                <div class="mini-chart-header">
                    <span class="symbol">DOGE</span>
                    <span class="change positive">-</span>
                </div>
                <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width: 100%; height: 40px;"><polyline points="0,32 25,26 50,22 75,12 100,4" fill="none" stroke="#5BD99B" stroke-width="1.5"/></svg>
            </div>
            <div class="mini-chart-card">
                <div class="mini-chart-header">
                    <span class="symbol">AVAX</span>
                    <span class="change negative">-</span>
                </div>
                <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width: 100%; height: 40px;"><polyline points="0,10 25,16 50,20 75,26 100,32" fill="none" stroke="#E3766F" stroke-width="1.5"/></svg>
            </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; gap: 8px;">
                <a th:href="@{/main/list(keyword=${keyword})}" class="filter-chip" th:classappend="${type == null} ? ' active' : ''">전체</a>
                <a th:href="@{/main/list(type='TRADE_LOG', keyword=${keyword})}" class="filter-chip" th:classappend="${type != null and type.name() == 'TRADE_LOG'} ? ' active' : ''">매매일지</a>
                <a th:href="@{/main/list(type='INSIGHT', keyword=${keyword})}" class="filter-chip" th:classappend="${type != null and type.name() == 'INSIGHT'} ? ' active' : ''">인사이트</a>
            </div>

            <form th:action="@{/main/list}" method="get" class="d-flex gap-2">
                <input type="hidden" name="type" th:value="${type}">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm dark-input" placeholder="검색어를 입력하세요" style="width: 200px;">
                <button type="submit" class="btn btn-sm btn-accent">검색</button>
                <a th:href="@{/main/list(type=${type})}" class="btn btn-sm btn-outline-light">전체 보기</a>
            </form>
        </div>

        <a href="/post/write/form" class="btn btn-accent mb-3"><i class="bi bi-plus-lg"></i> 새 글 작성</a>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px;">
            <a th:each="post : ${posts}"
               th:href="@{/post/detail/{id}(id=${post.id})}"
               class="post-card">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span th:if="${post.type.name() == 'TRADE_LOG'}" class="badge-tradelog">매매일지</span>
                        <span th:if="${post.type.name() == 'INSIGHT'}" class="badge-insight">인사이트</span>
                        <span th:if="${post.type.name() == 'TRADE_LOG' and post.ticker != null}"
                              style="font-size: 11px; color: var(--text-secondary);"
                              th:text="${post.ticker} + (${post.position != null} ? ' · ' + ${post.position} : '')">BTC · LONG</span>
                    </div>
                    <span th:if="${post.type.name() == 'TRADE_LOG' and post.profitRate != null}"
                          th:text="(${post.profitRate.signum() >= 0} ? '+' : '') + ${post.profitRate} + '%'"
                          th:style="${post.profitRate.signum() >= 0} ? 'color: var(--accent-teal); font-family: monospace; font-size: 13px; font-weight: 500;' : 'color: var(--accent-red); font-family: monospace; font-size: 13px; font-weight: 500;'">+0.0%</span>
                </div>
                <div class="post-title" th:text="${post.title}">제목</div>
                <div class="post-meta">
                    <span th:text="${post.user != null ? post.user.username : '알 수 없음'}">작성자</span>
                    <span> · </span>
                    <span th:text="${#temporals.format(post.lastModifiedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2024-01-01 12:34</span>
                </div>
            </a>
        </div>

        <nav th:if="${posts.totalPages > 1}" aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center dark-pagination">
                <li class="page-item" th:classappend="${!posts.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/main/list(page=0, keyword=${keyword}, type=${type})}" tabindex="-1" aria-disabled="true">&lt;&lt;</a>
                </li>
                <li class="page-item" th:classappend="${!posts.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/main/list(page=${posts.number - 1}, keyword=${keyword}, type=${type})}">&lt;</a>
                </li>

                <li th:each="i: ${#numbers.sequence(0, posts.totalPages - 1)}"
                    th:classappend="${i == posts.number} ? 'active'"
                    class="page-item">
                    <a class="page-link" th:href="@{/main/list(page=${i}, keyword=${keyword}, type=${type})}" th:text="${i + 1}">1</a>
                </li>

                <li class="page-item" th:classappend="${!posts.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/main/list(page=${posts.number + 1}, keyword=${keyword}, type=${type})}">&gt;</a>
                </li>
                <li class="page-item" th:classappend="${!posts.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/main/list(page=${posts.totalPages - 1}, keyword=${keyword}, type=${type})}">&gt;&gt;</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
