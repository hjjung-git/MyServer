<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>JHJ's Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/dark-theme.css}" rel="stylesheet">
</head>
<body class="dark-theme">
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <div class="app-main">
        <div class="app-topbar">
            <h1>대시보드</h1>

            <div sec:authorize="isAnonymous()">
                <a href="/user/login" class="btn btn-outline-light btn-sm me-2">로그인</a>
                <a href="/user/join" class="btn btn-accent btn-sm">회원가입</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                <span class="me-3" style="font-size: 13px; color: var(--text-secondary);">
                    <b sec:authentication="name" style="color: var(--text-primary);"></b>님
                </span>
                <form th:action="@{/user/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-outline-light btn-sm">로그아웃</button>
                </form>
            </div>
        </div>

        <!-- 매매 통계 KPI -->
        <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));">
            <div class="kpi-card">
                <div class="label">총 매매</div>
                <div class="value" th:text="${tradeCount}">0</div>
            </div>
            <div class="kpi-card accent-positive">
                <div class="label">승률</div>
                <div class="value positive" th:text="${winRate}">-</div>
            </div>
            <div class="kpi-card">
                <div class="label">평균 수익률</div>
                <div class="value"
                     th:text="${avgRate}"
                     th:classappend="${avgRateSign == 'positive'} ? ' positive' : ' negative'">-</div>
            </div>
            <div class="kpi-card accent-positive">
                <div class="label">최고 수익</div>
                <div class="value positive" th:text="${bestRate}">-</div>
            </div>
            <div class="kpi-card">
                <div class="label">최대 손실</div>
                <div class="value negative" th:text="${worstRate}">-</div>
            </div>
            <div class="kpi-card accent-purple">
                <div class="label">인사이트</div>
                <div class="value highlight" th:text="${insightCount}">0</div>
            </div>
        </div>

        <!-- BTC 차트 + 워치리스트 -->
        <div style="display: grid; grid-template-columns: 1.7fr 1fr; gap: 14px; margin-bottom: 24px;">
            <div class="chart-panel">
                <div class="chart-header">
                    <span class="symbol">BTC / KRW</span>
                    <span class="change positive">데이터 연동 예정</span>
                </div>
                <svg viewBox="0 0 400 140" preserveAspectRatio="none" style="width: 100%; height: 140px; display: block;">
                    <polyline points="0,105 30,112 60,96 90,103 120,83 150,87 180,70 210,77 240,54 270,61 300,39 330,45 360,22 400,9"
                              fill="none" stroke="#5BD99B" stroke-width="2"/>
                    <polygon points="0,105 30,112 60,96 90,103 120,83 150,87 180,70 210,77 240,54 270,61 300,39 330,45 360,22 400,9 400,140 0,140"
                             fill="#5BD99B" opacity="0.08"/>
                </svg>
                <div class="chart-axis-labels">
                    <span>D-6</span><span>D-4</span><span>D-2</span><span>오늘</span>
                </div>
            </div>

            <div class="content-card">
                <div class="section-label">워치리스트</div>
                <div class="watchlist-row">
                    <span class="symbol">BTC</span>
                    <svg viewBox="0 0 60 20" style="width: 60px; height: 20px;"><polyline points="0,14 15,16 30,9 45,11 60,3" fill="none" stroke="#5BD99B" stroke-width="1.5"/></svg>
                    <span class="change positive">-</span>
                </div>
                <div class="watchlist-row">
                    <span class="symbol">ETH</span>
                    <svg viewBox="0 0 60 20" style="width: 60px; height: 20px;"><polyline points="0,4 15,7 30,6 45,12 60,17" fill="none" stroke="#E3766F" stroke-width="1.5"/></svg>
                    <span class="change negative">-</span>
                </div>
                <div class="watchlist-row">
                    <span class="symbol">SOL</span>
                    <svg viewBox="0 0 60 20" style="width: 60px; height: 20px;"><polyline points="0,16 15,12 30,13 45,6 60,2" fill="none" stroke="#5BD99B" stroke-width="1.5"/></svg>
                    <span class="change positive">-</span>
                </div>
            </div>
        </div>

        <!-- 미니 차트 그리드 -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px;">
            <div class="mini-chart-card">
                <div class="mini-chart-header"><span class="symbol">XRP</span><span class="change positive">-</span></div>
                <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:40px;"><polyline points="0,28 25,30 50,24 75,18 100,14" fill="none" stroke="#5BD99B" stroke-width="1.5"/></svg>
            </div>
            <div class="mini-chart-card">
                <div class="mini-chart-header"><span class="symbol">ADA</span><span class="change negative">-</span></div>
                <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:40px;"><polyline points="0,14 25,18 50,22 75,28 100,34" fill="none" stroke="#E3766F" stroke-width="1.5"/></svg>
            </div>
            <div class="mini-chart-card">
                <div class="mini-chart-header"><span class="symbol">DOGE</span><span class="change positive">-</span></div>
                <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:40px;"><polyline points="0,32 25,26 50,22 75,12 100,4" fill="none" stroke="#5BD99B" stroke-width="1.5"/></svg>
            </div>
            <div class="mini-chart-card">
                <div class="mini-chart-header"><span class="symbol">AVAX</span><span class="change negative">-</span></div>
                <svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:40px;"><polyline points="0,10 25,16 50,20 75,26 100,32" fill="none" stroke="#E3766F" stroke-width="1.5"/></svg>
            </div>
        </div>

        <!-- 바로가기 카드 -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="content-card shortcut-card" onclick="openPanel('TRADE_LOG')" style="cursor:pointer;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="bi bi-graph-up-arrow" style="font-size:22px; color:var(--accent-teal);"></i>
                    <div>
                        <div style="font-size:13px; font-weight:500; color:var(--text-primary);">매매일지</div>
                        <div style="font-size:11px; color:var(--text-tertiary);" th:text="${tradeCount} + '개의 기록'">0개의 기록</div>
                    </div>
                </div>
            </div>
            <div class="content-card shortcut-card" onclick="openPanel('INSIGHT')" style="cursor:pointer;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="bi bi-lightbulb" style="font-size:22px; color:var(--accent-pink);"></i>
                    <div>
                        <div style="font-size:13px; font-weight:500; color:var(--text-primary);">인사이트</div>
                        <div style="font-size:11px; color:var(--text-tertiary);" th:text="${insightCount} + '개의 기록'">0개의 기록</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 푸시 패널 (1/3 화면) -->
    <div id="app-panel" class="app-panel">
        <div class="panel-inner">
            <div class="panel-header">
                <span id="panel-title" class="panel-header-title">매매일지</span>
                <button class="panel-close-btn" onclick="closePanel()" title="닫기">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            <div id="panel-body" class="panel-body"></div>
        </div>
    </div>
</div>

<script th:inline="none">
    var currentPanelType = null;

    function openPanel(type) {
        currentPanelType = type;
        document.getElementById('panel-title').textContent = type === 'TRADE_LOG' ? '매매일지' : '인사이트';
        document.getElementById('app-panel').classList.add('open');
        loadBoard(type, 0, null);
    }

    function closePanel() {
        document.getElementById('app-panel').classList.remove('open');
        currentPanelType = null;
    }

    function loadBoard(type, page, keyword) {
        var url = '/panel/board?type=' + type + '&page=' + (page || 0);
        if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
        fetch(url).then(function(r) { return r.text(); })
            .then(function(html) { document.getElementById('panel-body').innerHTML = html; });
    }

    function loadPost(id) {
        fetch('/panel/post/' + id).then(function(r) { return r.text(); })
            .then(function(html) { document.getElementById('panel-body').innerHTML = html; });
    }

    document.addEventListener('click', function(e) {
        var postCard = e.target.closest('[data-panel-post]');
        if (postCard) { e.preventDefault(); loadPost(postCard.dataset.panelPost); return; }

        var pageLink = e.target.closest('[data-panel-page]');
        if (pageLink) {
            e.preventDefault();
            var d = pageLink.dataset.panelPage.split(':');
            loadBoard(d[0], d[1], d[2] || null);
            return;
        }

        var backBtn = e.target.closest('[data-panel-back]');
        if (backBtn) { e.preventDefault(); loadBoard(backBtn.dataset.panelBack, 0, null); return; }
    });
</script>
</body>
</html>
