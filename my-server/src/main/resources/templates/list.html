<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>JHJ's Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 링크에 밑줄 없애고, 마우스를 올렸을 때만 밑줄 표시 */
        .post-title-link {
            text-decoration: none;
            color: inherit;
        }
        .post-title-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand" href="/main/list">JHJ's Log</a>

        <div class="d-flex"> <!-- ms-auto 대신 d-flex로 정렬 -->
            <!-- 로그인 안 했을 때 -->
            <div sec:authorize="isAnonymous()">
                <a href="/user/login" class="btn btn-outline-primary btn-sm me-2">로그인</a>
                <a href="/user/join" class="btn btn-primary btn-sm">회원가입</a>
            </div>

            <!-- 로그인 했을 때 -->
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                <span class="navbar-text me-3" style="font-size: 0.9rem;">
                환영합니다, <b sec:authentication="name"></b>님!
                </span>
                <form th:action="@{/user/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-outline-danger btn-sm">로그아웃</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center my-4">
        <h3>포스트 목록</h3>

        <!-- 검색창 -->
        <form th:action="@{/main/list}" method="get" class="row g-3 mb-3">
            <div class="col-auto">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="검색어를 입력하세요">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-secondary">검색</button>
                <a th:href="@{/main/list}" class="btn btn-outline-secondary">전체 보기</a>
            </div>
        </form>

        <!-- 글쓰기 버튼 -->
        <a href="/post/write/form" class="btn btn-primary">글쓰기</a>
    </div>

    <!-- 포스트 목록 테이블 -->
    <table class="table table-striped">
        <thead>
        <tr>
            <th style="width: 10%;">번호</th>
            <th style="width: 50%;">제목</th>
            <th style="width: 20%;">작성자</th>
            <th style="width: 20%;">작성일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td>
                <a th:href="@{/post/detail/{id}(id=${post.id})}" class="post-title-link" th:text="${post.title}">제목</a>
            </td>
            <td th:text="${post.user != null ? post.user.username : '알 수 없음'}">작성자</td>
            <td th:text="${#temporals.format(post.lastModifiedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2024-01-01 12:34</td>
        </tr>
        </tbody>
    </table>

    <!-- 페이지네이션 -->
    <nav th:if="${posts.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <!-- '<<' (첫 페이지) 버튼 -->
            <li class="page-item" th:classappend="${!posts.hasPrevious()} ? 'disabled'">
                <!-- keyword 파라미터 추가 -->
                <a class="page-link" th:href="@{/main/list(page=0, keyword=${keyword})}" tabindex="-1" aria-disabled="true"><<</a>
            </li>
            <!-- '<' (이전 페이지) 버튼 -->
            <li class="page-item" th:classappend="${!posts.hasPrevious()} ? 'disabled'">
                <!-- keyword 파라미터 추가 -->
                <a class="page-link" th:href="@{/main/list(page=${posts.number - 1}, keyword=${keyword})}"><</a>
            </li>

            <!-- 페이지 번호 루프 -->
            <li th:each="i: ${#numbers.sequence(0, posts.totalPages - 1)}"
                th:classappend="${i == posts.number} ? 'active'"
                class="page-item">
                <!-- keyword 파라미터 추가 -->
                <a class="page-link" th:href="@{/main/list(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>

            <!-- '>' (다음 페이지) 버튼 -->
            <li class="page-item" th:classappend="${!posts.hasNext()} ? 'disabled'">
                <!-- keyword 파라미터 추가 -->
                <a class="page-link" th:href="@{/main/list(page=${posts.number + 1}, keyword=${keyword})}">></a>
            </li>
            <!-- '>>' (마지막 페이지) 버튼 -->
            <li class="page-item" th:classappend="${!posts.hasNext()} ? 'disabled'">
                <!-- keyword 파라미터 추가 -->
                <a class="page-link" th:href="@{/main/list(page=${posts.totalPages - 1}, keyword=${keyword})}">>></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
