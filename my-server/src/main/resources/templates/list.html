<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JHJ's Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 링크에 밑줄 없애고, 마우스를 올렸을 때만 밑줄 표시 */
        .post-title-link {
            text-decoration: none;
            color: inherit;
        }
        .post-title-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center my-4">
        <h1>포스트 목록</h1>
        <!-- ⭐ 글쓰기 버튼을 우측 상단에 추가 -->
        <a href="/post/write/form" class="btn btn-primary">글쓰기</a>
    </div>

    <!-- 포스트 목록 테이블 -->
    <table class="table table-striped">
        <thead>
        <tr>
            <th style="width: 5%;">번호</th>
            <th style="width: 50%;">제목</th>
            <th style="width: 15%;">작성자</th>
            <th style="width: 15%;">수정 시간</th>
            <th style="width: 15%;">관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td>
                <a th:href="@{/post/detail/{id}(id=${post.id})}" class="post-title-link" th:text="${post.title}">제목</a>
            </td>
            <td th:text="${post.username}">작성자</td>
            <td th:text="${#temporals.format(post.lastModifiedAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">2024-01-01 12:34</td>
            <td>
                <a th:href="@{/post/edit/{id}(id=${post.id})}" class="btn btn-warning btn-sm me-1">수정</a>
                <a th:href="@{/post/delete/{id}(id=${post.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 페이지네이션 -->
    <nav th:if="${posts.totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <!-- '<<' (첫 페이지) 버튼 -->
            <li class="page-item" th:classappend="${!posts.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/main/list(page=0)}" tabindex="-1" aria-disabled="true"><<</a>
            </li>
            <!-- '<' (이전 페이지) 버튼 -->
            <li class="page-item" th:classappend="${!posts.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/main/list(page=${posts.number - 1})}"><</a>
            </li>

            <!-- 페이지 번호 루프 -->
            <li th:each="i: ${#numbers.sequence(0, posts.totalPages - 1)}"
                th:classappend="${i == posts.number} ? 'active'"
                class="page-item">
                <a class="page-link" th:href="@{/main/list(page=${i})}" th:text="${i + 1}">1</a>
            </li>

            <!-- '>' (다음 페이지) 버튼 -->
            <li class="page-item" th:classappend="${!posts.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/main/list(page=${posts.number + 1})}">></a>
            </li>
            <!-- '>>' (마지막 페이지) 버튼 -->
            <li class="page-item" th:classappend="${!posts.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/main/list(page=${posts.totalPages - 1})}">>></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
