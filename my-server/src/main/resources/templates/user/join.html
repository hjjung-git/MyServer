<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/dark-theme.css}" rel="stylesheet">
</head>
<body class="dark-theme">
<div class="auth-shell">
    <div class="auth-card">
        <h3>회원가입</h3>

        <div th:if="${param.error}" class="alert alert-warning" role="alert">
            이미 존재하는 아이디입니다.
        </div>

        <form th:action="@{/user/joinProc}" method="post">
            <div class="mb-3">
                <label for="loginId" class="form-label">아이디</label>
                <input type="text" class="form-control dark-input" id="loginId" name="loginId" required>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">닉네임</label>
                <input type="text" class="form-control dark-input" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control dark-input" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-accent w-100">가입하기</button>
        </form>
        <div class="form-text-link">
            <a href="/user/login">로그인으로 돌아가기</a>
        </div>
    </div>
</div>
</body>
</html>
