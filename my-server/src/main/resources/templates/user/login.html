<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
<div class="card p-4" style="width: 400px;">
    <h3 class="text-center mb-4">로그인</h3>

    <!-- 차단 메시지 -->
    <div th:if="${param.error == 'blocked'}" class="alert alert-warning" role="alert">
        로그인 시도가 너무 많습니다. 15분 후에 다시 시도해주세요.
    </div>

    <!-- 일반 에러 메시지 -->
    <div th:if="${param.error != null and param.error != 'blocked'}" class="alert alert-danger" role="alert">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!-- SecurityConfig의 .loginProcessingUrl("/user/loginProc")와 맞춰야 함 -->
    <form th:action="@{/user/loginProc}" method="post">
        <div class="mb-3">
            <label for="loginId" class="form-label">아이디</label>
            <input type="text" class="form-control" id="loginId" name="loginId" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
    <div class="text-center mt-3">
        <a href="/user/join">회원가입</a>
    </div>
</div>
</body>
</html>
