<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/dark-theme.css}" rel="stylesheet">
</head>
<body class="dark-theme">
<div class="auth-shell">
    <div class="auth-card">
        <h3>로그인</h3>

        <!-- 차단 메시지 -->
        <div th:if="${param.error == 'blocked'}" class="alert alert-warning" role="alert">
            로그인 시도가 너무 많습니다. 15분 후에 다시 시도해주세요.
        </div>

        <!-- 일반 에러 메시지 -->
        <div th:if="${param.error != null and param.error != 'blocked'}" class="alert alert-danger" role="alert">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>

        <!-- SecurityConfig의 .loginProcessingUrl("/user/loginProc")와 맞춰야 함 -->
        <form th:action="@{/user/loginProc}" method="post">
            <div class="mb-3">
                <label for="loginId" class="form-label">아이디</label>
                <input type="text" class="form-control dark-input" id="loginId" name="loginId" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control dark-input" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-accent w-100">로그인</button>
        </form>
        <div class="form-text-link">
            <a href="/user/join">회원가입</a>
        </div>
    </div>
</div>
</body>
</html>
