<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새 포스트 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1>새 포스트 작성</h1>
            <hr>
            <!-- ⭐ 이 form의 action은 기존과 동일하게 /post/write 로 보냄 -->
            <form action="/post/write" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="제목을 입력하세요" required>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">작성자</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="작성자" required>
                </div>
                <div class="mb-3">
                    <label for="content" class="form-label">내용</label>
                    <textarea id="content" name="content" class="form-control" rows="15" placeholder="내용을 입력하세요" required></textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">작성 완료</button>
                    <!-- ⭐ 취소 시 목록 페이지로 돌아가는 링크 -->
                    <a href="/main/list" class="btn btn-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
